<!-- src/main/resources/public/index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuSalud — Plataforma Clínica de Monitoreo Biométrico</title>
    <link rel="icon" type="image/png" href="/img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f0f7ff 0%, #e4f1fe 50%, #eef9f3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-clinical {
            background: #0d3b66;
        }
        .auth-card {
            border: none;
            border-radius: 1.2rem;
            box-shadow: 0 12px 35px rgba(13, 59, 102, 0.12);
        }
        .brand-logo-lg {
            width: 84px;
            height: 84px;
            object-fit: contain;
        }
    </style>
</head>
<body data-page="auth">

    <!-- Navbar Oficial -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-clinical shadow-sm py-2">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="/">
                <img src="/img/logo.png" alt="Logo TuSalud" width="38" height="38" class="me-2 rounded bg-white p-1">
                <span>TuSalud</span>
            </a>
            <span class="navbar-text text-light small d-none d-sm-inline">
                <i class="bi bi-shield-check me-1"></i>Sistema Clínico Biométrico Multidispositivo
            </span>
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <main class="container my-auto py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-6 col-xl-5">
                <div class="card auth-card p-3 p-sm-4 bg-white">
                    <div class="text-center mb-3">
                        <img src="/img/logo.png" alt="Logo Oficial TuSalud" class="brand-logo-lg mb-2">
                        <h3 class="fw-bold text-primary mb-1" style="color: #0d3b66 !important;">TuSalud</h3>
                        <p class="text-muted small mb-0">Monitoreo inteligente de indicadores biométricos y salud preventiva</p>
                    </div>

                    <!-- Alerta Dinámica de Errores / Mensajes (R8) -->
                    <div id="alertContainer"></div>

                    <!-- Pestañas Login / Registro -->
                    <ul class="nav nav-pills nav-fill mb-4 bg-light rounded-3 p-1" id="authTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active fw-semibold" id="login-tab" data-bs-toggle="pill" data-bs-target="#pane-login" type="button" role="tab">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar Sesión
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link fw-semibold" id="register-tab" data-bs-toggle="pill" data-bs-target="#pane-register" type="button" role="tab">
                                <i class="bi bi-person-plus me-1"></i>Crear Cuenta
                            </button>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <!-- Formulario Login -->
                        <div class="tab-pane fade show active" id="pane-login" role="tabpanel">
                            <form id="formLogin" novalidate>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold small">Correo electrónico</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                        <input type="email" id="loginCorreo" class="form-control" placeholder="usuario@correo.com" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold small">Contraseña</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                                    <i class="bi bi-heart-pulse me-1"></i>Ingresar a TuSalud
                                </button>
                            </form>
                        </div>

                        <!-- Formulario Registro -->
                        <div class="tab-pane fade" id="pane-register" role="tabpanel">
                            <form id="formRegister" novalidate>
                                <div class="mb-2">
                                    <label class="form-label fw-semibold small">Nombre completo</label>
                                    <input type="text" id="regNombre" class="form-control" placeholder="Ej: Juan Pérez" required>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label fw-semibold small">Correo electrónico</label>
                                    <input type="email" id="regCorreo" class="form-control" placeholder="juan@correo.com" required>
                                </div>
                                <div class="row g-2 mb-2">
                                    <div class="col-6">
                                        <label class="form-label fw-semibold small">Fecha de nacimiento</label>
                                        <input type="date" id="regFechaNac" class="form-control" required>
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label fw-semibold small">Género</label>
                                        <select id="regGenero" class="form-select" required>
                                            <option value="Masculino">Masculino</option>
                                            <option value="Femenino">Femenino</option>
                                            <option value="Otro">Otro</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold small">Contraseña (mínimo 6 caracteres)</label>
                                    <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
                                </div>
                                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
                                    <i class="bi bi-check2-circle me-1"></i>Registrarme y Configurar Salud
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-3 text-muted small">
        TuSalud &copy; 2026 — Programación Avanzada (2.° Año Bachillerato Tecnológico en Informática - UTU)
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
